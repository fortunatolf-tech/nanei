packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true

# GHSA-5j98-mcp5-4vw2: glob 11.0.x (transitivo via workbox-build) — força a versão corrigida
overrides:
  "glob@>=11.0.0 <11.1.0": ">=11.1.0"
  # GHSA (find-my-way DDoS HTTP/2): transitivo via prisma dev server
  "find-my-way@<=9.6.0": ">=9.6.1"
