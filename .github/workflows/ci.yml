name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

      # §8.3 — bloqueia em vulnerabilidade alta/crítica, mas tolera quedas do
      # registro npm (503/timeout): indisponibilidade de infraestrutura não é
      # falha de segurança e não deve travar o merge.
      - name: Auditoria de dependências (§8.3 — sem vulnerabilidade alta/crítica)
        run: |
          set +e
          saida=$(pnpm audit --audit-level high 2>&1)
          codigo=$?
          echo "$saida"
          if [ "$codigo" -eq 0 ]; then
            exit 0
          fi
          if echo "$saida" | grep -qiE "ERR_PNPM_AUDIT_BAD_RESPONSE|503|Service Unavailable|ETIMEDOUT|ENOTFOUND|ECONNRESET|aborted due to timeout"; then
            echo "::warning::Registro npm indisponível — auditoria adiada (sem bloquear o merge)."
            exit 0
          fi
          exit "$codigo"
